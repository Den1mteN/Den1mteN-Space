        space • music • thoughts • notes • eFootball

<!-- 🧭 MENU -->

    <a href="/music.html">Music</a>

<div id="userPanel"></div>

<!-- 🔥 FEATURED POST -->
<div class="featured-post" id="featured-post">

    Loading...

</div>
</div>

<div class="photos">

    <!-- LEFT PHOTO -->
    <div class="photo-card left-photo">
        <img src="/assets/images/ava.jpg">
    </div>

    <!-- RIGHT PHOTO -->
    <div class="photo-card right-photo">
        <img src="/assets/images/devil.jpg">
    </div>

</div>

<!-- LOGIN MODAL -->

<div id="loginModal">

    <div class="loginWindow">

        <span id="closeLogin">&times;</span>

<h2>Welcome back</h2>

<p>

    Enter your Space

</p>


        <input
            id="email"
            type="email"
            placeholder="Email">

        <input
            id="password"
            type="password"
            placeholder="Password">

        <button id="loginBtn">

            Login

        </button>

        <button id="registerOpen">
    Create account
       </button>

    <div id="registerModal" class="loginWindow">

    <span id="closeRegister">&times;</span>

    <h2>Create account</h2>

    <input
        id="registerUsername"
        type="text"
        placeholder="Username">

    <input
        id="registerEmail"
        type="email"
        placeholder="Email">

    <input
        id="registerPassword"
        type="password"
        placeholder="Password">

    <button id="registerBtn">
        Register
    </button>

</div>

    </div>

</div>

<div id="settingsModal" class="settings-modal hidden">

    <div class="settings-panel">

        <button id="closeSettings" class="settings-close">
            &times;
        </button>

        <h2>⚙ Settings</h2>

        <!-- USERNAME -->

        <div class="settings-section">

            <h3>Username</h3>

            <input
                id="settingsUsername"
                type="text"
                placeholder="New username">

            <button id="updateUsernameBtn">
                Update username
            </button>

        </div>

        <!-- EMAIL -->

        <div class="settings-section">

            <h3>Email</h3>

            <input
                id="settingsEmail"
                type="email"
                placeholder="New email">

            <input
                id="settingsEmailPassword"
                type="password"
                placeholder="Current password">

            <button id="updateEmailBtn">
                Update email
            </button>

        </div>

        <!-- PASSWORD -->

        <div class="settings-section">

            <h3>Password</h3>

            <input
                id="currentPassword"
                type="password"
                placeholder="Current password">

            <input
                id="newPassword"
                type="password"
                placeholder="New password">

            <input
                id="confirmPassword"
                type="password"
                placeholder="Confirm new password">

            <button id="updatePasswordBtn">
                Change password
            </button>

        </div>

    </div>

</div>

<script src="/app.js"></script>
<script src="/js/profile-menu.js?v=2"></script>
<script src="/auth.js"></script>
<script src="/js/settings.js"></script>
