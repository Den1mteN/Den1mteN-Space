<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Den1mteN Space</title>

<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    color: white;
    overflow-x: hidden;
}

/* 🌌 BACKGROUND */
.bg {
    position: fixed;
    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    background-image: url('/images/den.png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    z-index: -3;
}

/* 🌑 DARK OVERLAY */
.bg-overlay {
    position: fixed;
    width: 100%;
    height: 100%;

    background: rgba(0,0,0,0.72);

    z-index: -2;
}

/* ✨ LIGHT EFFECT */
.glow {
    position: fixed;
    width: 100%;
    height: 100%;

    background:
        radial-gradient(circle at center,
        rgba(0,229,255,0.10),
        transparent 60%);

    z-index: -1;
}

/* 🧠 BRAND */
.brand {
    padding-top: 25px;
    text-align: center;
}

.brand h1 {
    margin: 0;

    font-size: 72px;
    letter-spacing: 3px;

    background: linear-gradient(
        90deg,
        #ffffff,
        #00e5ff,
        #ffffff
    );

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;

    text-shadow: 0 0 25px rgba(0,229,255,0.25);
}

.brand p {
    margin-top: 10px;

    color: #00e5ff;

    font-size: 18px;
    letter-spacing: 2px;
}

/* 🧭 MENU */
.menu {
    margin-top: 30px;

    display: flex;
    justify-content: center;
    gap: 22px;

    flex-wrap: wrap;
}

.menu a {
    text-decoration: none;

    color: white;

    padding: 12px 22px;

    border-radius: 40px;

    background: rgba(255,255,255,0.08);

    backdrop-filter: blur(10px);

    border: 1px solid rgba(255,255,255,0.12);

    transition: 0.25s;

    font-weight: bold;
}

.menu a:hover {
    transform: scale(1.08);

    background: rgba(0,229,255,0.15);

    box-shadow: 0 0 20px rgba(0,229,255,0.25);
}

/* 🔥 FEATURED POST */
.featured-wrapper {
    width: 100%;

    display: flex;
    justify-content: center;

    margin-top: 55px;
}

.featured-post {

    width: 70%;
    max-width: 900px;

    background: rgba(255,255,255,0.08);

    backdrop-filter: blur(10px);

    border-radius: 24px;

    padding: 35px;

    border: 1px solid rgba(255,255,255,0.12);

    box-shadow:
        0 0 30px rgba(0,229,255,0.08);
}

/* title */
.featured-title {
    color: #00e5ff;

    font-size: 14px;

    letter-spacing: 3px;

    margin-bottom: 15px;
}

/* post name */
.featured-post h2 {
    margin-top: 0;

    font-size: 34px;
}

/* text */
.featured-post p {
    color: #cccccc;

    line-height: 1.7;
}

/* views */
.views {
    margin-top: 25px;

    color: #00e5ff;

    font-weight: bold;
}

/* 📸 PHOTO AREA */
/* 📸 PHOTO AREA */
.photos {

    margin-top: 70px;

    width: 100%;

    display: flex;
    justify-content: space-between;

    padding-left: 40px;
    padding-right: 40px;

    box-sizing: border-box;

    padding-bottom: 70px;
}

/* 🫧 PHOTO CARD */
.photo-card {

    width: 32%;
    height: 520px;

    overflow: hidden;

    border-radius: 28px;

    position: relative;

    background: rgba(255,255,255,0.05);

    backdrop-filter: blur(10px);

    border: 1px solid rgba(255,255,255,0.12);

    transition: 0.35s;

    box-shadow:
        0 0 25px rgba(0,0,0,0.35);
}

/* ✨ HOVER */
.photo-card:hover {

    transform: scale(1.02);

    box-shadow:
        0 0 35px rgba(0,229,255,0.20);
}

/* 🖼 IMAGE */
.photo-card img {

    width: 100%;
    height: 100%;

    object-fit: cover;
}

/* USER PANEL */

#userPanel{

    position:absolute;

    top:40px;

    right:45px;

    z-index:100;

}

#loginOpen{

    display:flex;

    align-items:center;

    gap:10px;

    background:rgba(255,255,255,.08);

    color:white;

    border:1px solid rgba(255,255,255,.18);

    border-radius:50px;

    padding:12px 22px;

    cursor:pointer;

    backdrop-filter:blur(15px);

    font-weight:bold;

    font-size:15px;

    transition:.30s;

    box-shadow:0 0 15px rgba(0,229,255,.08);

}

#loginOpen:hover{

    transform:translateY(-2px);

    background:rgba(0,229,255,.18);

    box-shadow:0 0 25px rgba(0,229,255,.25);

}


#loginOpen:hover{

    background:rgba(0,229,255,.15);

    transform:scale(1.05);

}

/* MODAL */

#loginModal{

    display:none;

    position:fixed;

    top:0;

    left:0;

    width:100%;

    height:100%;

    background:rgba(0,0,0,.82);

    justify-content:center;

    align-items:center;

    z-index:9999;

}

.loginWindow{

    width:420px;

    background:rgba(30,30,30,.95);

    backdrop-filter:blur(20px);

    border-radius:24px;

    padding:40px;

    display:flex;

    flex-direction:column;

    gap:18px;

    border:1px solid rgba(255,255,255,.12);

    box-shadow:0 0 40px rgba(0,229,255,.18);

    position:relative;

}

.loginWindow h2{

    margin:0;

    color:#00e5ff;

    text-align:center;

}

.loginWindow p{

    color:#cccccc;

    text-align:center;

}

.loginWindow input{

    padding:14px;

    border:none;

    border-radius:10px;

    font-size:16px;

}

.loginWindow button{

    padding:14px;

    background:#00d9ff;

    color:white;

    border:none;

    border-radius:10px;

    cursor:pointer;

    font-weight:bold;

    transition:.25s;

}

.loginWindow button:hover{

    transform:scale(1.03);

}

#closeLogin{

    position:absolute;

    right:18px;

    top:10px;

    font-size:30px;

    cursor:pointer;

    color:white;

}


/* 🎯 LEFT IMAGE FOCUS */
.left-photo img {

    object-position: center top;
}

/* 🎯 RIGHT IMAGE FOCUS */
.right-photo img {

    object-position: center center;

    filter:
        contrast(1.1)
        brightness(0.92);
}
.photo-card:hover {
    transform: scale(1.03);

    box-shadow:
        0 0 25px rgba(0,229,255,0.18);
}

/* image */
.photo-card img {
    width: 100%;
    height: 100%;

    object-fit: cover;
}

</style>
</head>

<body>

<div class="bg"></div>
<div class="bg-overlay"></div>
<div class="glow"></div>

<!-- 🧠 BRAND -->
<div class="brand">

    <h1>Den1mteN</h1>

    <p>
        space • music • thoughts • notes • eFootball
    </p>

</div>

<!-- 🧭 MENU -->
<div class="menu">

    <a href="/">Home</a>

    <a href="/music.html">Music</a>

    <a href="/blog.html">Blog</a>

    <a href="/healthy.html">Healthy</a>

    <a href="/efootball.html">eFootball</a>

    <a href="/notes.html">Notes</a>

</div>

<div id="userPanel">

<button id="loginOpen">

    👤 Login

</button>


</div>

<!-- 🔥 FEATURED POST -->
<div class="featured-post" id="featured-post">

    Loading...

</div>
</div>

<div class="photos">

    <!-- LEFT PHOTO -->
    <div class="photo-card left-photo">
        <img src="/images/ava.jpg">
    </div>

    <!-- RIGHT PHOTO -->
    <div class="photo-card right-photo">
        <img src="/images/devil.jpg">
    </div>

</div>

<!-- LOGIN MODAL -->

<div id="loginModal">

    <div class="loginWindow">

        <span id="closeLogin">&times;</span>

<h2>Welcome back</h2>

<p>

    Enter your Space

</p>


        <input
            id="email"
            type="email"
            placeholder="Email">

        <input
            id="password"
            type="password"
            placeholder="Password">

        <button id="loginBtn">

            Login

        </button>

    </div>

</div>


<script src="/app.js"></script>
<script src="/auth.js"></script>

<section>

    <h2>🎵 Latest Music</h2>

    <div id="tracks">

        Loading...

    </div>

</section>

</body>
</html>
